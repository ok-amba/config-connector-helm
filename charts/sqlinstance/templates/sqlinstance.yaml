{{- if eq .Values.name "sqlinstance-sample" -}}
{{- fail "you have not given your sqlinstance a proper name" -}}
{{- end -}}

{{- include "sqlinstance.validate-availability-type" $ }}

# A fail fast check to prevent users from enabling PSC without preparing the SQLInstance for PSC first.
{{- if and .Values.enablePSC (not .Values.preparePSC) }}
{{- fail "enablePSC=true requires preparePSC=true (apply preparePSC first, then enable PSC)" }}
{{- end }}

apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: {{ .Values.name | required "A SQL Instance resource name is required." }}
  {{- if or (not .Values.deletionPolicyRemoveResource) (.Values.annotations) (.Values.argoSyncWave) }}
  annotations:
    {{- with .Values.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if not .Values.deletionPolicyRemoveResource }}
    cnrm.cloud.google.com/deletion-policy: abandon
    {{- end }}
    {{- if .Values.argoSyncWave }}
    argocd.argoproj.io/sync-wave: {{ .Values.argoSyncWave | quote }}
    {{- end }}
  {{- end }}
  labels:
    {{- include "sqlinstance.labels" . | nindent 4 }}
    {{- range $k, $v := $.Values.labels }}
    {{- printf "%s: %s" $k ($v | quote) | nindent 4 }}
    {{- end }}
spec:
  databaseVersion: {{ .Values.databaseVersion }}
  region: europe-west3
  settings:
    availabilityType: {{ .Values.availabilityType }}
    tier: {{ include "sqlinstance.validate-tier" $ }}
    edition: ENTERPRISE

    {{- with .Values.backupConfiguration }}
    backupConfiguration:
      backupRetentionSettings:
        retainedBackups: {{ .backupRetentionSettings.retainedBackups}}
      enabled: {{ .enabled }}
      location: eu
      pointInTimeRecoveryEnabled: {{ .pointInTimeRecoveryEnabled }}
      startTime: {{ .startTime }}
      transactionLogRetentionDays: {{ .transactionLogRetentionDays }}
    {{- end }}

    {{- with .Values.insightsConfig }}
    insightsConfig:
      queryInsightsEnabled: {{ .queryInsightsEnabled }}
      recordApplicationTags: {{ .recordApplicationTags }}
      # When using Private Service Connect, the recordClientAddress flag must ALWAYS be set to false, 
      # otherwise the SQLInstance will fail to update with an error like "Invalid request: recordClientAddress must be false when private connectivity is enabled."
      recordClientAddress: {{- if $.Values.preparePSC }} false {{- else }} {{ .recordClientAddress }} {{- end }}
    {{- end }}

    {{- with .Values.maintenanceWindow }}
    maintenanceWindow:
      day: {{ .day }}
      hour: {{ .hour }}
      updateTrack: {{ .updateTrack }}
    {{- end }}

    ipConfiguration:
      ipv4Enabled: true
      {{- if .Values.preparePSC }}
      privateNetwork: projects/{{ .Values.global.projectID | required "A project ID is required" }}/global/networks/migration-vpc
      {{- end }}
      {{- if .Values.enablePSC }}
      pscConfig:
        enabled: true
      {{- end }}

    databaseFlags:
      - name: cloudsql.iam_authentication
        value: "on"
      - name: random_page_cost
        value: "1.1"
      - name: work_mem
        value: {{ include "sqlinstance.work-mem" $ }}
      {{- range $name, $value := .Values.databaseFlags }}
      - name: {{ $name }}
        value: {{ $value | quote }}
      {{- end }}
